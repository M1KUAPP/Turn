appId: com.m1ku.turn
name: Phrase bank character limit
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 30000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Settings
    direction: UP
- tapOn: Settings
- scrollUntilVisible:
    element: Phrase bank
    direction: DOWN
- tapOn: Phrase bank
- extendedWaitUntil:
    visible: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Quick
    direction: UP
    speed: 10
- tapOn: Quick
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Edit
    direction: UP
- scrollUntilVisible:
    element: Add phrase
    direction: DOWN
    speed: 10
- tapOn: Add phrase
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: Phrase
      below: Phrase
    direction: DOWN
- assertVisible:
    text: Phrase
    below: Phrase
- takeScreenshot: bank-3-character-limit-form
- scrollUntilVisible:
    element:
      text: Phrase
      below: Phrase
    direction: DOWN
- tapOn:
    text: Phrase
    below: Phrase
- inputText: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
- scrollUntilVisible:
    element: '0 characters left'
    direction: DOWN
- scrollUntilVisible:
    visibilityPercentage: 50
    centerElement: true
    element: '^x{200}$'
    direction: DOWN
    speed: 10
- scrollUntilVisible:
    element: '0 characters left'
    direction: DOWN
- assertVisible: '0 characters left'
- scrollUntilVisible:
    visibilityPercentage: 50
    centerElement: true
    element: '^x{200}$'
    direction: DOWN
    speed: 10
- assertVisible: '^x{200}$'
- assertNotVisible: '^x{201}$'
- takeScreenshot: bank-3-character-limit-boundary
- scrollUntilVisible:
    element: Save
    direction: UP
- tapOn: Save
- scrollUntilVisible:
    visibilityPercentage: 50
    centerElement: true
    element: '^x{200}$'
    direction: DOWN
    speed: 10
- extendedWaitUntil:
    visible: '^x{200}$'
    timeout: 10000
- takeScreenshot: bank-3-character-limit-saved
