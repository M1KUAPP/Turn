appId: com.m1ku.turn
name: Places
---
- launchApp:
    clearState: true
- tapOn: Settings
- scrollUntilVisible:
    element: Places
- tapOn: Places
- assertVisible: 'Choose a place from the Home screen. Move places here to change the picker order.'
- takeScreenshot: places-list
- scrollUntilVisible:
    element: 'Add place'
- tapOn: 'Add place'
- inputText: Clinic
- tapOn: Save
- assertVisible: Clinic
- takeScreenshot: places-added
