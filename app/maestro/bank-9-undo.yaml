appId: com.m1ku.turn
name: Phrase bank undo after one minute
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- scrollUntilVisible:
    element: Phrase bank
- tapOn: Phrase bank
- extendedWaitUntil:
    visible: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Chat
- tapOn: Chat
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- waitForAnimationToEnd
- tapOn: Edit
- scrollUntilVisible:
    element:
      text: Delete
      below: 'Hi, how are you\?'
      above: "I'm good, thanks"
- tapOn:
    text: Delete
    below: 'Hi, how are you\?'
    above: "I'm good, thanks"
- extendedWaitUntil:
    visible: Phrase deleted
    timeout: 10000
- assertNotVisible: 'Hi, how are you\?'
- assertVisible: Undo
- takeScreenshot: bank-9-undo-staged
- runScript: wait-one-minute.js
- assertVisible: Phrase deleted
- assertVisible: Undo
- takeScreenshot: bank-9-undo-after-one-minute
- tapOn: Undo
- extendedWaitUntil:
    visible: 'Hi, how are you\?'
    timeout: 10000
- waitForAnimationToEnd
- assertNotVisible: Phrase deleted
- takeScreenshot: bank-9-undo-restored
