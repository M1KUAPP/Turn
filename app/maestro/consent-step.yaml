appId: com.m1ku.turn
name: Consent step
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- waitForAnimationToEnd
# A fresh install offers the starter card (BANK-10), whose Not now would also match below; set it aside first.
- runFlow:
    when:
      notVisible:
        text: Repeat
        rightOf: Type
    commands:
      - scrollUntilVisible:
          element: Not now
          centerElement: true
          direction: DOWN
          timeout: 60000
- tapOn: Not now
- scrollUntilVisible:
    element: '.*Replies to your partner appear here\..*'
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element: Listen
- tapOn: Listen
- scrollUntilVisible:
    element: Before Listen mode starts
- extendedWaitUntil:
    visible: Before Listen mode starts
    timeout: 10000
- takeScreenshot: consent-step-intro
- scrollUntilVisible:
    element: Not now
- scrollUntilVisible:
    element: Allow
    direction: UP
- assertVisible: Allow
- scrollUntilVisible:
    element: Not now
- assertVisible: Not now
- takeScreenshot: consent-step-options
- scrollUntilVisible:
    element: Read the privacy notice
- tapOn: Read the privacy notice
- scrollUntilVisible:
    element: What stays on this iPhone
- extendedWaitUntil:
    visible: What stays on this iPhone
    timeout: 10000
- takeScreenshot: consent-step-privacy-notice
- swipe:
    start: '50%, 10%'
    end: '50%, 80%'
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Before Listen mode starts
    direction: UP
- assertVisible: Before Listen mode starts
- takeScreenshot: consent-step-return
