appId: com.m1ku.turn
name: Under-18 partner
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 30000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Listen
- tapOn: Listen
- extendedWaitUntil:
    visible: Before Listen mode starts
    timeout: 10000
- scrollUntilVisible:
    element: Allow
- tapOn: Allow
- extendedWaitUntil:
    visible: Can my phone listen while we talk\?
    timeout: 10000
- scrollUntilVisible:
    element: My partner is under 18
- tapOn:
    text: My partner is under 18
    checked: false
- assertVisible:
    text: My partner is under 18
    checked: true
- scrollUntilVisible:
    element: They agreed
- tapOn: They agreed
- extendedWaitUntil:
    visible: Mic off
    timeout: 10000
- assertVisible: End
- takeScreenshot: consent-under18-mic-off
- scrollUntilVisible:
    element: Listen mode is off for this partner
- assertVisible: Listen mode is off for this partner
- takeScreenshot: consent-under18-caption-note
- scrollUntilVisible:
    element: Listen mode is off for this partner\.
- assertVisible: Listen mode is off for this partner\.
- takeScreenshot: consent-under18-row-note
