appId: com.m1ku.turn
name: Turn Listen failed purchase
---
# A failed Test Store purchase leaves Listen mode locked and says so (#59, PAY-5).
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Settings
- tapOn: Settings
# After clearKeychain on a fresh Simulator, Turn's first Keychain read can take over a minute, and RevenueCat
# starts only once Turn has that ID; the relay's status reads working from the same point (#133).
- scrollUntilVisible:
    element: 'Listen service: working'
    direction: DOWN
    speed: 20
    timeout: 150000
- scrollUntilVisible:
    element: Restore Purchases
    direction: UP
    speed: 20
    visibilityPercentage: 50
    timeout: 60000
- tapOn: Unlock Listen mode
- extendedWaitUntil:
    visible: Keep Listen mode on
    timeout: 30000
- waitForAnimationToEnd
# The published paywall hides Settings' row of the same words, so this is the paywall's button.
- tapOn: Unlock Listen mode
- extendedWaitUntil:
    visible: Test Store Purchase
    timeout: 30000
- tapOn: Test failed purchase
- waitForAnimationToEnd
- takeScreenshot: paywall-failed
# RevenueCat's own error, if it shows one, then the paywall's close button.
- runFlow:
    when:
      visible: OK
    commands:
      - tapOn: OK
- takeScreenshot: paywall-failed-dismissed
# The published paywall labels its close button ✕; the fallback's said Close.
- tapOn: 'Close|✕'
- extendedWaitUntil:
    visible: "The purchase didn't go through. Listen mode is still locked."
    timeout: 30000
- assertVisible: Unlock Listen mode
- takeScreenshot: paywall-failed-locked
