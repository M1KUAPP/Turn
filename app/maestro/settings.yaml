appId: com.m1ku.turn
name: Settings
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Settings
- tapOn: Settings
- scrollUntilVisible:
    element: Your words
    direction: DOWN
    speed: 20
    visibilityPercentage: 50
- extendedWaitUntil:
    visible: Your words
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: settings-top
# At AX5 Settings runs several screens long, so both scrolls get a minute.
- scrollUntilVisible:
    element: Erase all data
    timeout: 60000
# The relay's status sits in Listen mode's group, near the top (frame 33).
- scrollUntilVisible:
    element: 'Listen service: .*'
    direction: UP
    timeout: 60000
# The build reaches the relay: a Keychain or network failure leaves it "can't be reached".
- extendedWaitUntil:
    visible: 'Listen service: working'
    timeout: 15000
- takeScreenshot: settings-bottom
