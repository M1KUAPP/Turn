appId: com.m1ku.turn
name: Consent not now
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- waitForAnimationToEnd
# A fresh install offers the starter card (BANK-10), whose Not now would also match below; set it aside first.
- runFlow:
    when:
      notVisible:
        text: Repeat
        rightOf: Type
    commands:
      # Slowly, so centering stops with the button between the bars rather than under the top one.
      - scrollUntilVisible:
          element: Not now
          centerElement: true
          direction: DOWN
          speed: 10
          timeout: 60000
- tapOn: Not now
# Dismissing the card can leave the list above or below the row, so look up, then down.
- scrollUntilVisible:
    element: '.*Replies to your partner appear here\..*'
    direction: UP
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element: '.*Replies to your partner appear here\..*'
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: Listen
- tapOn: Listen
- scrollUntilVisible:
    element: Before Listen mode starts
- extendedWaitUntil:
    visible: Before Listen mode starts
    timeout: 10000
- scrollUntilVisible:
    element: Not now
- tapOn: Not now
- waitForAnimationToEnd
# Centered, since a phrase that has just come into view can sit under the bottom bar, where a tap lands on the bar.
- scrollUntilVisible:
    element: 'Yes'
    centerElement: true
    speed: 10
- tapOn: 'Yes'
- scrollUntilVisible:
    element: '^Listen$'
- tapOn: '^Listen$'
- scrollUntilVisible:
    element: Before Listen mode starts
- extendedWaitUntil:
    visible: Before Listen mode starts
    timeout: 10000
- takeScreenshot: consent-not-now-step-returned
