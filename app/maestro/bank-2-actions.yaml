    notVisible: Flow phrase
    timeout: 10000
- tapOn: Phrase bank
- waitForAnimationToEnd
- scrollUntilVisible:
    element: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    direction: UP
- extendedWaitUntil:
    visible: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Quick
- tapOn: Quick
- scrollUntilVisible:
    element: Moved phrase
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- extendedWaitUntil:
    visible: Moved phrase
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    text: Home
    below: Moved phrase
- assertVisible:
    text: Shop
    below: Moved phrase
- takeScreenshot: bank-2-actions-edited-phrase-in-quick
