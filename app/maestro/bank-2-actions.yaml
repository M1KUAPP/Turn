appId: com.m1ku.turn
name: Phrase bank actions and category limit
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 30000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Type
    direction: DOWN
- tapOn: Type
- extendedWaitUntil:
    visible: Type what to say
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Type what to say
    direction: DOWN
- inputText: Maestro limit marker
- scrollUntilVisible:
    element: Speak
    direction: DOWN
- tapOn: Speak
- scrollUntilVisible:
    element: Close composer
    direction: UP
- tapOn: Close composer
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Settings
    direction: UP
- tapOn: Settings
- scrollUntilVisible:
    element: Phrase bank
    direction: DOWN
- tapOn: Phrase bank
- extendedWaitUntil:
    visible: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    timeout: 10000
- waitForAnimationToEnd
# At AX5 each category card holds its four buttons, so Typed, last in the list, is several screens down.
- scrollUntilVisible:
    element: Typed
    direction: DOWN
    speed: 40
    timeout: 60000
- assertVisible: Typed
- takeScreenshot: bank-2-actions-categories
- scrollUntilVisible:
    element: Add category
    direction: DOWN
    speed: 10
- tapOn: Add category
- extendedWaitUntil:
    visible: Category name
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Category name
    direction: DOWN
    speed: 10
- takeScreenshot: bank-2-actions-add-category-form
- scrollUntilVisible:
    element: Category name
    direction: DOWN
- tapOn: Category name
- inputText: Automation
- scrollUntilVisible:
    element: Save
    direction: UP
- tapOn: Save
- scrollUntilVisible:
    element: Automation
    direction: DOWN
    speed: 10
- scrollUntilVisible:
    element: 'You can have up to 12 categories\.'
    direction: DOWN
    speed: 10
- extendedWaitUntil:
    visible: 'You can have up to 12 categories\.'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: Add category
      enabled: false
    direction: DOWN
    speed: 10
- assertVisible:
    text: Add category
    enabled: false
- assertNotVisible:
    text: Add category
    enabled: true
- takeScreenshot: bank-2-actions-limit-at-12
- scrollUntilVisible:
    element:
      text: Rename
      below: Automation
      above: Conversation strip
    direction: UP
    speed: 10
- tapOn:
    text: Rename
    below: Automation
    above: Conversation strip
- extendedWaitUntil:
    visible: Rename category
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Automation
    direction: DOWN
    speed: 10
- takeScreenshot: bank-2-actions-rename-category-form
- scrollUntilVisible:
    element: Automation
    direction: DOWN
- tapOn: Automation
- eraseText: 40
- inputText: Flow category
- scrollUntilVisible:
    element: Save
    direction: UP
- tapOn: Save
- scrollUntilVisible:
    element:
      text: Move up
      below: Flow category
      above: Conversation strip
    direction: DOWN
    speed: 10
- tapOn:
    text: Move up
    below: Flow category
    above: Conversation strip
# Moving a card keeps the scroll position, so at AX5 the moved card's name ends up above the screen.
- scrollUntilVisible:
    element:
      text: Flow category
      above: Typed
    direction: UP
    speed: 10
- assertVisible:
    text: Flow category
    above: Typed
- scrollUntilVisible:
    element:
      text: Move down
      below: Flow category
      above: Typed
    direction: DOWN
    speed: 10
- tapOn:
    text: Move down
    below: Flow category
    above: Typed
- scrollUntilVisible:
    element:
      text: Typed
      above: Flow category
    direction: UP
    speed: 10
- assertVisible:
    text: Typed
    above: Flow category
- takeScreenshot: bank-2-actions-category-order
- scrollUntilVisible:
    element: Flow category
    direction: DOWN
    speed: 10
- tapOn: Flow category
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: bank-2-actions-phrase-list
- scrollUntilVisible:
    element: Add phrase
    direction: DOWN
- tapOn: Add phrase
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: Phrase
      below: Phrase
    direction: DOWN
- assertVisible:
    text: Phrase
    below: Phrase
- takeScreenshot: bank-2-actions-add-phrase-form
- scrollUntilVisible:
    element:
      text: Phrase
      below: Phrase
    direction: DOWN
- tapOn:
    text: Phrase
    below: Phrase
- inputText: Flow phrase
# The phrase field opens focused. At AX5 the keyboard then covers the place chips, but Maestro still counts them as
# visible, so its taps type into the keyboard. A tap on the Phrase label, which handles no touches, puts it away first.
- tapOn:
    text: Phrase
    above:
      text: Phrase
      below: Phrase
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: Home
      below: Places
    direction: DOWN
- tapOn:
    text: Home
    below: Places
- scrollUntilVisible:
    element:
      text: Clinic
      below: Places
    direction: DOWN
- tapOn:
    text: Clinic
    below: Places
- scrollUntilVisible:
    element: Save
    direction: UP
- tapOn: Save
- scrollUntilVisible:
    element: Flow phrase
    direction: DOWN
- extendedWaitUntil:
    visible: Flow phrase
    timeout: 10000
- waitForAnimationToEnd
# The row names its phrase and lists its places as its value, and Maestro matches each on its own.
- scrollUntilVisible:
    element: Flow phrase
    direction: DOWN
- assertVisible: Flow phrase
- assertVisible: '(Clinic, Home|Home, Clinic)'
- takeScreenshot: bank-2-actions-phrase-added
- scrollUntilVisible:
    element: Phrase bank
    direction: UP
- tapOn: Phrase bank
- waitForAnimationToEnd
# The categories list keeps its scroll position, and at AX5 its top is several screens up.
- scrollUntilVisible:
    element: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    direction: UP
    timeout: 90000
- extendedWaitUntil:
    visible: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    timeout: 10000
- waitForAnimationToEnd
# Flow category is last of the tall AX5 cards, further than the default 20 seconds of scrolling reach.
- scrollUntilVisible:
    element:
      text: Delete
      below: Flow category
      above: Conversation strip
    direction: DOWN
    speed: 10
    timeout: 90000
- tapOn:
    text: Delete
    below: Flow category
    above: Conversation strip
- extendedWaitUntil:
    visible: 'Choose where its phrases will go\.'
    timeout: 10000
- takeScreenshot: bank-2-actions-delete-category-destination
- scrollUntilVisible:
    element:
      text: Chat
      below: 'Choose where its phrases will go\.'
    direction: DOWN
    speed: 10
- tapOn:
    text: Chat
    below: 'Choose where its phrases will go\.'
- waitForAnimationToEnd
- assertNotVisible: Flow category
# Back to the top first: scrolling up only until Chat shows can leave it under the translucent navigation bar,
# where Maestro still taps it and the bar takes the tap.
- scrollUntilVisible:
    element: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    direction: UP
    timeout: 90000
- scrollUntilVisible:
    element: Chat
    direction: DOWN
- tapOn: Chat
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
# Flow phrase is last in Chat, several screens down at AX5.
- scrollUntilVisible:
    element: Flow phrase
    direction: DOWN
    timeout: 90000
- extendedWaitUntil:
    visible: Flow phrase
    timeout: 10000
- waitForAnimationToEnd
# The row names its phrase and lists its places as its value, and Maestro matches each on its own.
- scrollUntilVisible:
    element: Flow phrase
    direction: DOWN
    timeout: 90000
- assertVisible: Flow phrase
- assertVisible: '(Clinic, Home|Home, Clinic)'
- takeScreenshot: bank-2-actions-phrase-moved-with-category
- scrollUntilVisible:
    element: Edit
    direction: UP
- tapOn: Edit
# Edit mode gives every row its four buttons, so Chat grows to about seven screens at the default size, more at AX5.
- scrollUntilVisible:
    element:
      text: Edit
      below: Flow phrase
      above: Add phrase
    direction: DOWN
    timeout: 180000
- tapOn:
    text: Edit
    below: Flow phrase
    above: Add phrase
- extendedWaitUntil:
    visible: Edit phrase
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: Phrase
      below: Phrase
    direction: DOWN
- assertVisible:
    text: Phrase
    below: Phrase
- takeScreenshot: bank-2-actions-edit-phrase-form
# The field opens focused with the cursor after its text. A tap could move the cursor into the phrase once it wraps
# at AX5, and the erase deletes only what is before the cursor.
- eraseText: 30
- inputText: Moved phrase
- tapOn:
    text: Phrase
    above:
      text: Phrase
      below: Phrase
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Quick
    direction: LEFT
    speed: 10
- tapOn: Quick
- scrollUntilVisible:
    element:
      text: Clinic
      below: Places
    direction: DOWN
- tapOn:
    text: Clinic
    below: Places
- scrollUntilVisible:
    element:
      text: Shop
      below: Places
    direction: DOWN
- tapOn:
    text: Shop
    below: Places
- scrollUntilVisible:
    element: Save
    direction: UP
- tapOn: Save
- extendedWaitUntil:
    notVisible: Flow phrase
    timeout: 10000
- scrollUntilVisible:
    element: Phrase bank
    direction: UP
- tapOn: Phrase bank
- waitForAnimationToEnd
- scrollUntilVisible:
    element: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    direction: UP
    timeout: 90000
- extendedWaitUntil:
    visible: 'Categories organize your phrases\. Move categories here to change the tab order\.'
    timeout: 10000
- waitForAnimationToEnd
# The list is at its top, so Quick, the first card, can only be further down.
- scrollUntilVisible:
    element: Quick
    direction: DOWN
    speed: 10
- tapOn: Quick
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Moved phrase
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- extendedWaitUntil:
    visible: Moved phrase
    timeout: 10000
- waitForAnimationToEnd
# The row names its phrase and lists its places as its value, and Maestro matches each on its own.
- scrollUntilVisible:
    element: Moved phrase
    direction: DOWN
    timeout: 60000
- assertVisible: Moved phrase
- assertVisible: '(Home, Shop|Shop, Home)'
- takeScreenshot: bank-2-actions-edited-phrase-in-quick
