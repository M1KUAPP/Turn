    below: 'Choose where its phrases will go\.'
- waitForAnimationToEnd
- assertNotVisible: Flow category
- scrollUntilVisible:
    element: Chat
- tapOn: Chat
- extendedWaitUntil:
    visible: Edit
    timeout: 10000
- scrollUntilVisible:
    element: Flow phrase
- extendedWaitUntil:
    visible: Flow phrase
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    text: Home
    below: Flow phrase
- assertVisible:
    text: Clinic
    below: Flow phrase
- takeScreenshot: bank-2-actions-phrase-moved-with-category
- tapOn: Edit
- scrollUntilVisible:
    element:
      text: Edit
      below: Flow phrase
      above: Add phrase
- tapOn:
    text: Edit
    below: Flow phrase
    above: Add phrase
- extendedWaitUntil:
    visible: Edit phrase
    timeout: 10000
- waitForAnimationToEnd
- hideKeyboard
