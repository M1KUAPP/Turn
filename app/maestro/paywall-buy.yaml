appId: com.m1ku.turn
name: Turn Listen purchase
---
# A new Keychain ID owns nothing, so the paywall shows; Test Store buys in the Simulator (#59, PAY-4, PAY-6).
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Settings
- tapOn: Settings
# After clearKeychain on a fresh Simulator, Turn's first Keychain read can take over a minute, and RevenueCat
# starts only once Turn has that ID; the relay's status reads working from the same point (#133).
- scrollUntilVisible:
    element: 'Listen service: working'
    direction: DOWN
    speed: 20
    timeout: 150000
- scrollUntilVisible:
    element: Restore Purchases
    direction: UP
    speed: 20
    visibilityPercentage: 50
    timeout: 60000
- takeScreenshot: paywall-settings
- tapOn: Unlock Listen mode
- extendedWaitUntil:
    visible: Keep Listen mode on
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: paywall-open
# The published paywall hides Settings' row of the same words, so this is the paywall's button.
- tapOn: Unlock Listen mode
- extendedWaitUntil:
    visible: Test Store Purchase
    timeout: 30000
- takeScreenshot: paywall-test-store
- tapOn: Test valid purchase
- extendedWaitUntil:
    visible: Unlocked
    timeout: 60000
- takeScreenshot: paywall-unlocked
- tapOn: Restore Purchases
- extendedWaitUntil:
    visible: Listen mode is unlocked.
    timeout: 30000
- takeScreenshot: paywall-restored
