appId: com.m1ku.turn
name: Public README walkthrough
# Run against the public release on a fresh Simulator, with no seeded state or mocked relay.
---
- launchApp
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- waitForAnimationToEnd
# How It Works 1: use the supplied starter phrases and choose Clinic.
- assertVisible: Starter phrases
- takeScreenshot: readme-first-launch
- tapOn: Not now
- tapOn: Home
- tapOn: Clinic
- assertVisible: Clinic
# How It Works 2: speak a saved phrase, then the typed words shown in the README.
- tapOn: 'Yes'
- tapOn: Type
- inputText: I need a break
- tapOn: Speak
- tapOn: Close composer
- extendedWaitUntil:
    visible: Repeat
    timeout: 15000
# How It Works 3: both the person's and partner's consent.
- tapOn: Listen
- assertVisible: Before Listen mode starts
- tapOn: Allow
- assertVisible: 'Can my phone listen while we talk\?'
- takeScreenshot: readme-partner-consent
- tapOn: They agreed
# How It Works 4: the real hosted model selects a saved reply.
- tapOn: '.*Tap here to type what they say\..*'
- inputText: 'How was physio?'
- tapOn: Send
- assertVisible: '.*They said.*How was physio\?.*'
- extendedWaitUntil:
    visible:
      text: It was hard
      above: All
    timeout: 60000
- assertVisible: Repeat
- takeScreenshot: readme-before-speech
# This short utterance can finish during Maestro's normal settle wait.
- tapOn:
    text: It was hard
    above: All
    waitToSettleTimeoutMs: 0
- assertVisible: Stop
- takeScreenshot: readme-speaking
- extendedWaitUntil:
    visible: Repeat
    timeout: 15000
- takeScreenshot: readme-after-speech
