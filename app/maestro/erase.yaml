appId: com.m1ku.turn
name: Erase all data
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        text: Repeat
        rightOf: Type
    commands:
      - scrollUntilVisible:
          element: Not now
          centerElement: true
          direction: DOWN
          speed: 10
          timeout: 60000
- runFlow:
    when:
      visible:
        text: Repeat
        rightOf: Type
    commands:
      - assertVisible: 'The Turn team wrote these starter phrases\. Review them to make them yours\.'
- assertVisible: Not now
- tapOn: Not now
# Allow Listen mode first, as listen.yaml does, so the erase has a permission to forget.
- scrollUntilVisible:
    element: Listen
- tapOn: Listen
- scrollUntilVisible:
    element: Before Listen mode starts
- extendedWaitUntil:
    visible: Before Listen mode starts
    timeout: 10000
- scrollUntilVisible:
    element: Allow
- tapOn: Allow
- scrollUntilVisible:
    element: 'Can my phone listen while we talk\?'
- extendedWaitUntil:
    visible: Can my phone listen while we talk\?
    timeout: 10000
- scrollUntilVisible:
    element: They agreed
- tapOn: They agreed
- scrollUntilVisible:
    element: Mic off
- extendedWaitUntil:
    visible: Mic off
    timeout: 10000
- scrollUntilVisible:
    element: End
- tapOn: End
- scrollUntilVisible:
    element: '^Listen$'
- assertVisible: '^Listen$'
- scrollUntilVisible:
    element: Settings
    timeout: 60000
- tapOn: Settings
- scrollUntilVisible:
    element: Your words
    direction: DOWN
    speed: 20
    visibilityPercentage: 50
- extendedWaitUntil:
    visible: Your words
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Erase all data
    direction: DOWN
    speed: 20
    visibilityPercentage: 50
    timeout: 180000
- extendedWaitUntil:
    visible: Erase all data
    timeout: 10000
- takeScreenshot: erase-settings
- tapOn: Erase all data
- assertVisible: 'Erase all data\?'
- assertVisible: 'This deletes your phrases, places, tap counts, and settings, and brings back the starter phrases\.'
- takeScreenshot: erase-alert
- tapOn: Cancel
- assertVisible: Erase all data
- tapOn: Erase all data
- tapOn: Erase
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- runFlow:
    when:
      notVisible:
        text: Repeat
        rightOf: Type
    commands:
      - scrollUntilVisible:
          element: 'The Turn team wrote these starter phrases\. Review them to make them yours\.'
          centerElement: true
          direction: DOWN
          speed: 10
          timeout: 180000
- assertVisible: 'The Turn team wrote these starter phrases\. Review them to make them yours\.'
- takeScreenshot: erase-home
# The erase starts Turn's controllers again, so Listen mode asks for its permission as on first launch.
- scrollUntilVisible:
    element: Listen
- tapOn: Listen
- scrollUntilVisible:
    element: Before Listen mode starts
- extendedWaitUntil:
    visible: Before Listen mode starts
    timeout: 10000
- takeScreenshot: erase-permission-again
