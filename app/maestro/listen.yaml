appId: com.m1ku.turn
name: Typed Listen
---
- launchApp:
    clearState: true
- tapOn: Listen
- assertVisible: 'Mic off · Typed lines only'
- tapOn: '.*Tap here to type what they say\..*'
- inputText: 'Are you tired?'
- tapOn: Send
- assertVisible: '.*Are you tired\?.*'
- assertVisible: "I'm tired"
- takeScreenshot: listen-reply-row
- tapOn: End
- assertVisible: Listen
