appId: com.m1ku.turn
name: Home
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: home-first-view
- scrollUntilVisible:
    element: 'Yes'
    direction: DOWN
- takeScreenshot: home-grid
# From AX1 Home's column scrolls under both bars, and Maestro judges visibility against the whole screen, so it counts
# a tab under a bar as on screen and its tap lands on the bar. The tab steps run while the bottom bar is one row, as at
# the default size, where the tabs never scroll.
- runFlow:
    when:
      visible:
        text: Repeat
        rightOf: Type
    commands:
      - tapOn: Chat
      - assertVisible: 'Hi, how are you\?'
      - takeScreenshot: home-chat
      - tapOn: All
      - tapOn: Down
      - takeScreenshot: home-all-down
      - tapOn: Up
      - takeScreenshot: home-all-up
- tapOn: Type
- inputText: 'I need a break'
- assertVisible: 'I need a break'
- takeScreenshot: home-typing-composer
