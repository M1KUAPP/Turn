appId: com.m1ku.turn
name: Consent agree and edge swipe
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Listen
    timeout: 30000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Listen
- tapOn: Listen
- extendedWaitUntil:
    visible: Before Listen mode starts
    timeout: 10000
- scrollUntilVisible:
    element: Allow
- tapOn: Allow
- extendedWaitUntil:
    visible: Can my phone listen while we talk\?
    timeout: 10000
- scrollUntilVisible:
    element: They agreed
- tapOn: They agreed
- extendedWaitUntil:
    visible: Mic off
    timeout: 10000
- scrollUntilVisible:
    element: Chat
- tapOn: Chat
- extendedWaitUntil:
    visible: 'Hi, how are you\?'
    timeout: 10000
- takeScreenshot: consent-agree-swipe-chat
- swipe:
    start: '1%, 50%'
    end: '80%, 50%'
- waitForAnimationToEnd
- scrollUntilVisible:
    element: 'Hi, how are you\?'
- assertVisible: 'Hi, how are you\?'
- assertVisible: Mic off
- takeScreenshot: consent-agree-swipe-stays-home
