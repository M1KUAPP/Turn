# Builds Turn for the iOS Simulator with scripts/build-simulator.sh, the TRD's Simulator build: prebuild, CocoaPods,
# then xcodebuild in the Debug configuration, then the JavaScript bundle embedded. It proves the local Swift modules
# compile and Metro can bundle, which nobody on Linux can check, and keeps the zipped Turn.app for a week.
name: iOS Simulator build

on:
  pull_request:
    # Native changes only: every run spends macOS minutes, at ten times the Linux rate while the repository is private.
    paths:
      - 'modules/**'
      - 'app/package.json'
      - 'app/app.config.ts'
      - 'app/plugins/**'
      - 'app/live2d/**'
      - 'bun.lock'
      - 'scripts/build-simulator.sh'
      - 'scripts/fetch-companion-models.ts'
      - '.github/workflows/ios-simulator-build.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'The branch, tag, or commit to build; the one this runs from, when empty'
        required: false
        default: ''
      screenshots:
        description: 'Capture screenshots from the iOS Simulator'
        type: choice
        required: true
        default: pr
        options:
          - none
          - pr
          - full
          - dark
          - small
      flows:
        description: 'Only these Maestro flows, space- or comma-separated without .yaml; every flow when empty'
        required: false
        default: ''
      release:
        description: 'Publish Turn.app.zip as this release tag, such as v0.1.0, once the chosen flows pass; none when empty'
        required: false
        default: ''

permissions:
  contents: read

# A pull request's build and a started screenshot run of the same branch are separate groups, so opening or
# pushing to a pull request never cancels screenshots someone is waiting for.
concurrency:
  group: ios-simulator-build-${{ github.event_name }}-${{ inputs.ref || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub's Xcode 27 image, in preview: the TRD's Xcode 27 and iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 75
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The commit this zip comes from, which a release tags.
      - name: Name the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Use the newest Xcode 27 on the runner
        shell: bash
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      # The one command that makes the build judges run (#50), so every run here proves it.
      - name: Build Turn.app.zip
        env:
          # For gh, which fetches the companion's BOOTH models from this repo's companion-models release (plan 0049).
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-simulator.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Turn-simulator
          path: Turn.app.zip
          retention-days: 7

  screenshots:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots != 'none' }}
    runs-on: xcode-27
    # About 47 minutes per combination for the 21 flows, so a full run's five combinations need about four hours;
    # GitHub stops any job at six.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Use the newest Xcode 27 on the runner
        shell: bash
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Turn-simulator
          path: ${{ runner.temp }}/turn-simulator
      - name: Unzip Turn.app
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/turn-app" "$RUNNER_TEMP/Turn-screenshots"
          ditto -x -k "$RUNNER_TEMP/turn-simulator/Turn.app.zip" "$RUNNER_TEMP/turn-app"
      - name: Install Maestro CLI 2.10.0
        shell: bash
        run: |
          export MAESTRO_VERSION=2.10.0
          curl -fsSL https://get.maestro.mobile.dev | bash
          maestro_version="$("$HOME/.maestro/bin/maestro" --version)"
          printf '%s\n' "$maestro_version"
          [[ "$maestro_version" == *2.10.0* ]]
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Capture Simulator screenshots
        id: capture
        continue-on-error: true
        # Below the job's limit, so a run that overruns still uploads what it captured.
        timeout-minutes: 310
        shell: bash
        env:
          SCREENSHOT_MODE: ${{ inputs.screenshots }}
          FLOWS: ${{ inputs.flows }}
        run: |
          bash scripts/simulator-screenshots.sh \
            "$RUNNER_TEMP/turn-app/Turn.app" \
            "$RUNNER_TEMP/Turn-screenshots" \
            "$SCREENSHOT_MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Turn-screenshots
          path: ${{ runner.temp }}/Turn-screenshots
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if a flow failed
        if: always() && steps.capture.outcome == 'failure'
        run: exit 1

  # Publishes the build judges install (SUBMIT-3) as a release of the commit it came from, only when every flow the run
  # chose passed on this zip. gh refuses a tag that already exists, so a release is never replaced.
  release:
    needs: [build, screenshots]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release != '' && needs.screenshots.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Turn-simulator
          path: ${{ runner.temp }}/turn-simulator
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          SHA: ${{ needs.build.outputs.sha }}
          MODE: ${{ inputs.screenshots }}
          FLOWS: ${{ inputs.flows }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version="${TAG#v}"
          flows='every Maestro flow'
          if [[ -n "$FLOWS" ]]; then
            flows="$(printf '%s\n' ${FLOWS//,/ } | sed 's/.*/`&`/' | paste -sd, - | sed 's/,/, /g')"
          fi
          sizes="in its \`${MODE}\` screenshot mode"
          [[ "$MODE" == pr ]] && sizes='at the default text size and AX5'
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<NOTES
          Turn ${version} for the iOS Simulator, built from \`${SHA}\` by \`scripts/build-simulator.sh\`: a Debug build with its JavaScript embedded, so it runs without Metro, pointed at the team's relay. [This run](${RUN_URL}) installed the zip on a fresh iPhone 16 Simulator and passed ${flows} ${sizes}.

          ## Install

          On a Mac with Xcode 27 and the iOS 27 Simulator runtime, download \`Turn.app.zip\` below, boot an iOS 27 Simulator, and run:

          \`\`\`shell
          unzip Turn.app.zip
          xcrun simctl install booted Turn.app
          xcrun simctl launch booted com.m1ku.turn
          \`\`\`

          ## Try it

          1. At the top of Home, tap **Home** and choose **Clinic**.
          2. Tap **Listen**, then **Allow**, then **They agreed**.
          3. Tap **Tap here to type what they say.**, enter "How was physio?", and tap **Send**.
          4. "It was hard" appears in the row of replies. Tap it to hear it.

          Listen mode answers 20 partner lines for free; the 21st opens the Turn Listen paywall, which RevenueCat's Test Store completes as a test purchase. Live transcription needs a physical iPhone, so the Simulator takes typed partner lines.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/turn-simulator/Turn.app.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --latest \
            --title "Turn ${version} for the iOS Simulator" --notes-file "$notes"
